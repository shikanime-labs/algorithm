name: debug-treefmt
on:
  workflow_dispatch:
  push:
    branches: [update-flake-inputs]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shikanime-studio/setup-nix-action@v1
      - name: Run treefmt check and print offending files
        run: |
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash -c 'treefmt --tree-root=. --walk=git --check > /tmp/treefmt-out.txt 2>&1; cat /tmp/treefmt-out.txt' || true
