name: debug-treefmt
on:
  workflow_dispatch:
  push:
    branches: [update-flake-inputs]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shikanime-studio/setup-nix-action@v1
      - name: Render toml, strip zizmor, write-mode format, dump git status
        run: |
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash -c '
            set -e
            CFG=$(nix-store --query --requisites . 2>/dev/null | grep "treefmt.toml" | head -1)
            echo "CFG=$CFG"
            # strip [formatter.zizmor] block robustly
            python3 - <<PY
          import re
          s=open("'"$CFG"'").read()
          # remove zizmor formatter block (from its [formatter.zizmor] header to next top-level [)
          s=re.sub(r"\n\[formatter\.zizmor\].*?(\n\[|\Z)", "\n", s, flags=re.S)
          open("/tmp/alg_noziz.toml","w").write(s)
          print("zizmor stripped, remaining formatters:")
          print([l for l in s.splitlines() if l.startswith("[formatter")])
          PY
            echo "=== running treefmt WRITE mode (no zizmor) ==="
            treefmt --config-file=/tmp/alg_noziz.toml --tree-root=. --walk=git 2>&1 | tail -5 || true
            echo "=== GIT STATUS (files non-zizmor formatters WOULD change) ==="
            git --no-pager status --short | cat
          '
