name: debug-treefmt
on:
  workflow_dispatch:
  push:
    branches: [update-flake-inputs]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shikanime-studio/setup-nix-action@v1
      - name: Reveal devenv treefmt task (exact config + command)
        run: |
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash -c '
            echo "=== .devenv/tasks ==="
            ls -la .devenv/tasks/ 2>/dev/null
            echo "=== devenv:treefmt:run script ==="
            find .devenv -name "*treefmt*" 2>/dev/null -exec echo "--- {} ---" \; -exec cat {} \;
            echo "=== which treefmt / config env ==="
            env | grep -i treefmt
          '
