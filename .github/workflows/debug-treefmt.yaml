name: debug-treefmt
on:
  workflow_dispatch:
  push:
    branches: [update-flake-inputs]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shikanime-studio/setup-nix-action@v1
      - name: Capture treefmt check output to workspace
        run: |
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash -c 'treefmt --tree-root=. --walk=git --check 2>&1 | tee "${GITHUB_WORKSPACE}/treefmt-out.txt"' || true
      - name: Show captured output
        run: |
          cat "${GITHUB_WORKSPACE}/treefmt-out.txt"
