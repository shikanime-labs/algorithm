name: debug-treefmt
on:
  workflow_dispatch:
  push:
    branches: [update-flake-inputs]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shikanime-studio/setup-nix-action@v1
      - name: Write-mode format, dump git status
        run: |
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash .github/scripts/debug-treefmt.sh
