name: debug-treefmt
on:
  workflow_dispatch:
  push:
    branches: [update-flake-inputs]
env:
  REPO: ${{ github.workspace }}
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shikanime-studio/setup-nix-action@v1
      - name: Write-mode format the real checkout with full devenv config
        run: |
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash -c 'cd "$REPO" && treefmt --tree-root=. --walk=git || true'
        continue-on-error: true
      - name: Show git status of reformatted files
        run: |
          git -C "$REPO" status --short
