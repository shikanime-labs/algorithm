name: debug-treefmt
on:
  workflow_dispatch:
  push:
    branches: [update-flake-inputs]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shikanime-studio/setup-nix-action@v1
      - name: Run devenv tasks treefmt and list changed files
        run: |
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash -c '
            CFG=$(grep -rl "formatter.zizmor" $(nix-store --query --requisites . 2>/dev/null | grep "treefmt.toml$") 2>/dev/null | head -1)
            treefmt --config-file="$CFG" --tree-root=. --walk=git > /tmp/out.txt 2>&1 || true
            {
              echo "=== TREEFMT SUMMARY ==="
              tail -3 /tmp/out.txt
              echo "=== GIT STATUS ==="
              git status --short
            } > /tmp/result.txt 2>&1
            cat /tmp/result.txt
          ' || true
