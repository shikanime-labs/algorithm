name: debug-treefmt
on:
  workflow_dispatch:
  push:
    branches: [update-flake-inputs]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shikanime-studio/setup-nix-action@v1
      - name: Dump the treefmt.toml devenv test uses
        run: |
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash -c 'CFG=$(nix-store --query --requisites . 2>/dev/null | grep "treefmt.toml" | head -1); echo "=== TOML PATH: $CFG ==="; cat "$CFG"'
