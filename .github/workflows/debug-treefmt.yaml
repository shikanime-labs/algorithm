name: debug-treefmt
on:
  workflow_dispatch:
  push:
    branches: [update-flake-inputs]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shikanime-studio/setup-nix-action@v1
      - name: Write-mode format the real checkout (zizmor will fail; tolerated)
        run: |
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash -c 'CFG=$(nix-store --query --requisites . 2>/dev/null | grep "treefmt.toml" | head -1); echo "CFG=$CFG"; treefmt --config-file="$CFG" --tree-root="$GITHUB_WORKSPACE" --walk=git || true'
        continue-on-error: true
      - name: Git status of real checkout (files treefmt changed)
        run: |
          git -C "$GITHUB_WORKSPACE" status --short
