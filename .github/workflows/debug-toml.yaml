name: Debug Toml
permissions: {}

on:
  push:
    branches:
      - update-flake-inputs
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Print rendered treefmt TOML
        run: |
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash -c '
            CFG=$(grep -oP "(?<=--config-file )\S+" "$(which treefmt)")
            echo "=== TOML PATH: $CFG ==="
            cat "$CFG"
          '
