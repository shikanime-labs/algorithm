name: Debug Toml
permissions: {}

on:
  push:
    branches:
      - update-flake-inputs
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Print rendered treefmt TOML
        run: |
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash -c '
            echo "=== treefmt wrapper script ==="
            cat "$(which treefmt)"
            CFG=$(grep -oE "(--config-file[ =])[^ ]+" "$(which treefmt)" | sed "s/--config-file[ =]//")
            if [ -z "$CFG" ]; then
              CFG=$(grep -oE "/nix/store/[^ \"]*treefmt\.toml" "$(which treefmt)" | head -1)
            fi
            echo "=== TOML PATH: $CFG ==="
            cat "$CFG"
            echo "=== treefmt --ci -vv (debug) ==="
            treefmt --ci -vv || true
          '
