name: Debug Format
"on":
  workflow_dispatch:
  push:
    branches:
      - update-flake-inputs
permissions: {}
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
          permission-contents: read
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-studio/setup-nix-action@v1
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - run: |
          set +e
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash -c '
            set +e
            echo "TOML_DUMP_START"
            find . -path ./node_modules -prune -o -name "treefmt.toml" -print 2>/dev/null
            echo "---"
            T=$(find .devenv -name "treefmt.toml" 2>/dev/null | head -1)
            echo "T=$T"
            cat "$T" 2>/dev/null
            echo "TOML_DUMP_END"
          ' || true
