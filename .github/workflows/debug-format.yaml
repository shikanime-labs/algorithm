name: Debug Format
"on":
  workflow_dispatch:
  push:
    branches:
      - update-flake-inputs
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
          permission-contents: read
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-studio/setup-nix-action@v1
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - run: |
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash -c '
            set -e
            echo "=== baseline (generated config, excludes .pre-commit-config.yaml) ==="
            treefmt --check 2>&1 | grep -E "changed|traversed|emitted" || true
            echo
            for p in \
              ".devenv/*" \
              ".devenv/**" \
              ".devenv/**/*" \
              "**/.devenv/**" \
              ".devenv" \
              "**/.devenv/*" \
              ".direnv/**" \
              ".rumdl_cache/**" \
              ".rumdl_cache/*" ; do
              echo "=== candidate: $p ==="
              treefmt --check --excludes ".pre-commit-config.yaml" "$p" 2>&1 | grep -E "changed" || true
            done
          ' || true
