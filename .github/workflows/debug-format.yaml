name: Debug Format
"on":
  workflow_dispatch:
  push:
    branches:
      - update-flake-inputs
permissions: {}
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
          permission-contents: read
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-studio/setup-nix-action@v1
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - run: |
          set +e
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash -c 'set +e; T=$(find . -name treefmt.toml -not -path "*/node_modules/*" 2>/dev/null | head -1); echo "FOUND_TOML=$T"; sed -n "1,2p" "$T"' || true
