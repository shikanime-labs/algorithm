name: Debug Format
"on":
  workflow_dispatch:
  push:
    branches:
      - update-flake-inputs
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
          permission-contents: read
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-studio/setup-nix-action@v1
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - run: |
          nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command bash -c '
            set +e
            echo "RESULTS_START"
            for p in \
              ".devenv/**" \
              ".devenv/**/*" \
              "**/.devenv/**" \
              ".devenv" \
              ".devenv/*" \
              ".rumdl_cache/**" \
              ".rumdl_cache/*" \
              ".rumdl_cache" \
              ".pre-commit-config.yaml" \
              ".devenv/state/**" \
              ".devenv/tasks.db*" ; do
              OUT=$(treefmt --check --excludes ".pre-commit-config.yaml" "$p" 2>/dev/null | grep -oE "[0-9]+ changed" | head -1)
              echo "PAT=[$p] -> ${OUT:-UNKNOWN}"
            done
            echo "RESULTS_END"
          ' || true
