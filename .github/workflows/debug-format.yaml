name: Debug Format
"on":
  workflow_dispatch:
  push:
    branches:
      - update-flake-inputs
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - id: createGithubAppToken
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
          permission-contents: read
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.createGithubAppToken.outputs.token }}
      - uses: shikanime-studio/setup-nix-action@v1
        with:
          github-token: ${{ steps.createGithubAppToken.outputs.token }}
      - run: nix develop --accept-flake-config --no-pure-eval .#algorithm-cc --command treefmt --fix --verbose || true
      - run: echo "=== TRACKED CHANGED ===" && git diff --name-only || true
      - run: echo "=== IGNORED DIRTY ===" && git status --short --ignored | grep -E '^.!.!|!!' || true
      - run: echo "=== .devenv git status (untracked files) ===" && git -c core.quotepath=false status --short --ignored .devenv 2>/dev/null | head -40 || true
      - run: echo "=== generated treefmt.toml respect_gitignore ==="; find .devenv -name 'treefmt.toml' -exec grep -nE "respect_gitignore|excludes|devenv" {} \; 2>/dev/null | head -20 || true
